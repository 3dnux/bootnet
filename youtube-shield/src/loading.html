<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>ShieldTube</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #0f0f0f; color: #f1f1f1; font: 16px system-ui, sans-serif;
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #333; border-top-color: #fb542b;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div>Cargando las listas de bloqueo de Brave…</div>
  <p>La primera vez tarda unos segundos; después se usan desde caché.</p>
</body>
</html>
